services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      # PostgreSQL 18 images keep data under a version folder, so the volume mounts the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: sh -c 'python manage.py migrate && python manage.py seed_students && python manage.py runserver 0.0.0.0:8000'
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
